<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — карточка главы</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.proto-stage{max-width:min(1440px,100%);margin:80px auto 120px;padding:0 24px}
.proto-context{background:var(--cream);padding:clamp(32px,5vw,48px);border:1px solid var(--line)}
.proto-context .section-label{margin-bottom:12px}
/* Variant B — Editorial: image first */
.chapter-grid-card--editorial{padding:0;gap:0;overflow:hidden}
.chapter-grid-card--editorial .chapter-grid-media{margin:0;border:0;border-radius:0;order:-1}
.chapter-grid-card--editorial .chapter-grid-head{padding:18px 18px 8px;border:0}
.chapter-grid-card--editorial .chapter-grid-title{font:200 clamp(20px,2vw,26px)/1.15 var(--head);color:var(--green)}
.chapter-grid-card--editorial .chapter-grid-lead{padding:0 18px 18px}
/* Variant C — Compact rail */
.chapter-grid-card--rail{display:grid;grid-template-columns:1fr 96px;grid-template-rows:auto auto;gap:8px 12px;padding:14px 14px 12px}
.chapter-grid-card--rail .chapter-grid-num{grid-column:1;font-size:22px}
.chapter-grid-card--rail .chapter-grid-title{grid-column:1;margin:0}
.chapter-grid-card--rail .chapter-grid-lead{grid-column:1/-1;-webkit-line-clamp:2}
.chapter-grid-card--rail .chapter-grid-media{grid-column:2;grid-row:1/span 2;margin:0;aspect-ratio:1;border-radius:2px}
.chapter-grid-card--rail .chapter-grid-head{display:contents;border:0;padding:0}
</style>
</head>
<body>
<div class="proto-stage">
  <div class="proto-context" id="stage"></div>
</div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Mirai Grid</button>
  <button class="proto-picker-item">Editorial</button>
  <button class="proto-picker-item">Compact Rail</button>
</nav>
<script>
const sample = {
  num: '01',
  title: 'Одинокие астронавты',
  lead: 'Зачем это Carelink: каждый член семьи видит ситуацию только со своей стороны.',
  img: '../images/family-apart.jpg',
  alt: 'Семья врозь'
};
function cardHtml(extraClass) {
  const c = extraClass ? ' chapter-grid-card' + extraClass : '';
  return `<li class="chapter-grid-cell"><a class="chapter-grid-card${c}" href="#"><div class="chapter-grid-head"><span class="mono chapter-grid-num">${sample.num}</span><h3 class="chapter-grid-title">${sample.title}</h3></div><p class="chapter-grid-lead">${sample.lead}</p><figure class="chapter-grid-media"><img src="${sample.img}" alt="${sample.alt}" width="640" height="480"></figure></a></li>`;
}
const variants = [
  () => `<section class="chapter-index"><div class="chapter-index-in"><p class="section-label">Главы</p><h2 class="chapter-index-title">Mirai Grid</h2><ol class="chapter-grid landing-card-grid">${cardHtml('')}${cardHtml('')}</ol></div></section>`,
  () => `<section class="chapter-index"><div class="chapter-index-in"><p class="section-label">Главы</p><h2 class="chapter-index-title">Editorial</h2><ol class="chapter-grid landing-card-grid">${cardHtml(' chapter-grid-card--editorial')}</ol></div></section>`,
  () => `<section class="chapter-index"><div class="chapter-index-in"><p class="section-label">Главы</p><h2 class="chapter-index-title">Compact Rail</h2><ol class="chapter-grid landing-card-grid">${cardHtml(' chapter-grid-card--rail')}${cardHtml(' chapter-grid-card--rail')}</ol></div></section>`,
];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();});}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);});
setActive(0);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
<style>
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer}
.proto-picker-item[data-active]{color:#fff}
</style>
</body>
</html>
